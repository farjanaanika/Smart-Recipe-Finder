<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Recipe Finder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

     </head>
    <body>
    <div class="recipe-finder-container">
    <nav class="navbar">
    <div class="logo">🍽 Smart Recipe Finder</div>
    <ul class="nav-links">
    <li><a href="#">Home</a></li>
    <li><a href="#" id="favorites-link">❤️ Favorites</a></li>
    </ul>
       </nav>
    <section class="hero">
    <h1>Find Your Perfect Recipe</h1>

   <p>
   Explore delicious recipes from around the world and discover your next favorite meal.
   </p>

    </section> 
    <form id="search-form" class="search-box">
    <input
    type="text"
    id="search-input"
    placeholder="search recipe by name (eg. chicken)"
    autocomplete="off"
    required
    />
    <button type="submit" id="search-button">
        Search
    </button>
    <div id="suggestions-box" class="suggestions-box"></div>
    </form>
    <div class="random-button-container">
        <button id="random-button" class="random-button">Get Random Recipe</button>
    </div>
    <div class="message" id="message-area"></div>
    <h2 class="section-title">Popular Recipes</h2>
    <div id="loader" class="loader hidden">
    <div class="spinner"></div>
    <p>Loading recipes...</p>
    </div>
        <div id="results-grid" class="results-grid">
        </div>
        </div>
    <div class="modal-container hidden" id="recipe-modal">
        <div class="modal-content">
         <button id="modal-close-button" class="modal-close-button">&times;</button>
         <div id="recipe-details-content">
            <!-- Details will be loaded here -->
          </div>
          </div>
          </div>
          <script src="main.js"></script>
</body>
</html>
